
name: Generate Snake

# Controla quando a action vai rodar
on:
  schedule:
    # Roda automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  
  # Permite rodar manualmente na aba "Actions"
  workflow_dispatch:

# Dá a permissão de escrita necessária para o bot (Isso resolve o seu erro vermelho!)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout do repositório
      - uses: actions/checkout@v4

      # Gera as imagens da cobrinha
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          # Gera dois arquivos: um pro tema claro e um pro tema escuro do GitHub
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Faz o push das imagens para uma branch separada chamada "output" (Isso resolve o aviso amarelo!)
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
